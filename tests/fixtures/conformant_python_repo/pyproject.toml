[project]
name = "conformant"
version = "0.1.0"
description = "fixture conformant repo"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Test" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformant"]

[dependency-groups]
dev = ["pytest>=8.0", "ty>=0.0.1"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
