[project]
name = "intendant"
version = "4.1.1"
description = "Multi-stack project governance framework"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Damien Grauet" }]
keywords = ["governance", "audit", "scaffolding", "standards"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.16",
    "rich>=14.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.scripts]
intendant = "intendant.cli:main"

[project.urls]
Repository = "https://github.com/dgrauet/intendant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intendant"]

# Bundle the handbook, ADRs, and scaffold templates inside the wheel so an
# installed copy (no source checkout) can still run `explain`, `doctor`, and
# the scaffold engine. Resolved at runtime via intendant/_assets/ (see paths.py).
[tool.hatch.build.targets.wheel.force-include]
"docs/handbook" = "intendant/_assets/handbook"
"docs/adr" = "intendant/_assets/adr"
"templates" = "intendant/_assets/templates"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.10",
    "ty>=0.0.0a1",
    "pre-commit>=4.0",
    "commitizen>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]
markers = [
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["src/intendant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ty]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = false
