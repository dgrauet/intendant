[project]
name = "suzerain"
version = "0.1.7"
description = "Multi-stack project governance framework"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Damien Grauet" }]
keywords = ["governance", "audit", "scaffolding", "standards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.16",
    "rich>=14.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
suzerain = "suzerain.cli:main"

[project.urls]
Repository = "https://github.com/dgrauet/suzerain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suzerain"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.10",
    "ty>=0.0.0a1",
    "pre-commit>=4.0",
    "commitizen>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]
markers = [
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["src/suzerain"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = false
