version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current via reviewable PRs. Dependabot
  # reads the `# vX.Y.Z` comment next to each pinned SHA and bumps both together.
  # (Python deps are covered separately by Dependabot security updates.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
