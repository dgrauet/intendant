# intendant-template: v1
# Standalone ruff config — prefer the [tool.ruff] section in pyproject.toml.
# This file is provided for repos where pyproject.toml is not available.

line-length = 100
target-version = "py313"
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
