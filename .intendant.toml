[intendant]
version = "1"
stack = "python"
enforcement = "strict"

[exemptions]
# Nested stacks under tests/fixtures/ are fake repos used as test
# material for the engine — not sub-projects to govern.
LO004 = "tests/fixtures/ holds fake repos (test material), not sub-projects"
# Same cause: tool configs under tests/fixtures/ belong to the fake
# repos; intendant's CI has no reason to run their tools.
QU001 = "tool configs under tests/fixtures/ are test material, not this repo's tooling"
