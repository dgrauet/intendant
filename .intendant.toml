[intendant]
version = "1"
stack = "python"
enforcement = "strict"

[exemptions]
# Les stacks imbriquées sous tests/fixtures/ sont des repos factices servant
# de matière aux tests de l'engine — pas des sous-projets à gouverner.
LO004 = "tests/fixtures/ contient des repos factices (matière des tests), pas des sous-projets"
# Même cause : les configs outillage sous tests/fixtures/ appartiennent aux
# repos factices, la CI d'intendant n'a pas à exécuter leurs outils.
QU001 = "configs outillage sous tests/fixtures/ = matière des tests, pas des outils du repo"
